{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}
{% block content %}
<div class="page-header">
	<div>
		<h2>Change Password</h2>
		<p>Update your account password</p>
	</div>
</div>
<div class="card" style="max-width:480px;">
	<div class="card-header">
		<i class="bi bi-key me-2"></i>New Password
	</div>
	<div class="card-body p-4">
		<form method="POST" action="{{ url_for('auth.change_password') }}">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
			<div class="mb-3">
				<label class="form-label">Current Password</label>
				<div class="position-relative">
					<input type="password" name="current_password" id="current_password" class="form-control pe-5" required/>
					<button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-muted text-decoration-none px-3" onclick="const p=document.getElementById('current_password'); const isP=p.type==='password'; p.type=isP?'text':'password'; this.querySelector('i').className=isP?'bi bi-eye-slash-fill':'bi bi-eye-fill';" title="Toggle password visibility" style="z-index:5;">
						<i class="bi bi-eye-fill"></i>
					</button>
				</div>
			</div>
			<div class="mb-3">
				<label class="form-label">New Password</label>
				<div class="position-relative">
					<input type="password" name="new_password" id="new_password" class="form-control pe-5" required minlength="8"/>
					<button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-muted text-decoration-none px-3" onclick="const p=document.getElementById('new_password'); const isP=p.type==='password'; p.type=isP?'text':'password'; this.querySelector('i').className=isP?'bi bi-eye-slash-fill':'bi bi-eye-fill';" title="Toggle password visibility" style="z-index:5;">
						<i class="bi bi-eye-fill"></i>
					</button>
				</div>
				<div class="form-text">Minimum 8 characters</div>
			</div>
			<div class="mb-4">
				<label class="form-label">Confirm New Password</label>
				<div class="position-relative">
					<input type="password" name="confirm_password" id="confirm_password" class="form-control pe-5" required/>
					<button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-muted text-decoration-none px-3" onclick="const p=document.getElementById('confirm_password'); const isP=p.type==='password'; p.type=isP?'text':'password'; this.querySelector('i').className=isP?'bi bi-eye-slash-fill':'bi bi-eye-fill';" title="Toggle password visibility" style="z-index:5;">
						<i class="bi bi-eye-fill"></i>
					</button>
				</div>
			</div>
			<button type="submit" class="btn btn-primary w-100">Update Password</button>
		</form>
	</div>
</div>
{% endblock %}
