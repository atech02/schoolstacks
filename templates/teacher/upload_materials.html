{% extends "base.html" %}
{% block title %}Upload Materials{% endblock %}
{% block page_title %}Upload Materials{% endblock %}
{% block content %}
<div class="page-header">
	<div>
		<h2>Upload Learning Materials</h2>
		<p>Share resources with your students</p>
	</div>
</div>

<div class="card" style="max-width:580px;">
	<div class="card-header">
		<i class="bi bi-cloud-upload me-2"></i>Material Details
	</div>
	<div class="card-body p-4">
		<form method="POST" enctype="multipart/form-data">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

			<div class="mb-3">
				<label class="form-label">Title</label>
				<input type="text" name="title" class="form-control" placeholder="Material title" required>
			</div>

			<div class="mb-3">
				<label class="form-label">Description</label>
				<textarea name="description" class="form-control" rows="3" placeholder="Brief description..." required></textarea>
			</div>

			<div class="row g-3 mb-3">
				<div class="col-md-6">
					<label class="form-label">Class</label>
					<select name="class_id" class="form-select" required>
						<option value="">Select class...</option>
						{% for c in classes %}
						<option value="{{ c.id }}">{{ c.name }}</option>
						{% endfor %}
					</select>
				</div>

				<div class="col-md-6">
					<label class="form-label">Subject</label>
					<select name="subject_id" class="form-select" required>
						<option value="">Select subject...</option>
						{% for s in subjects %}
						<option value="{{ s.id }}">{{ s.name }}</option>
						{% endfor %}
					</select>
				</div>
			</div>

			<div class="mb-4">
				<label class="form-label">File</label>
				<input type="file" name="file" class="form-control" required accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg">
				<div class="form-text">Allowed: PDF, DOC, DOCX, TXT, PNG, JPG (max 16MB)</div>
			</div>

			<button type="submit" class="btn btn-primary w-100">
				<i class="bi bi-upload me-2"></i>Upload Material
			</button>
		</form>
	</div>
</div>
{% endblock %}
