<!-- create_assignment.html -->
{% extends "base.html" %}

{% block title %}Create Assignment{% endblock %}
{% block page_title %}Assignments{% endblock %}

{% block content %}
<div class="page-header">
	<div>
		<h2>Create Assignment</h2>
		<p>Set tasks for your students</p>
	</div>
</div>

<div class="card" style="max-width:580px;">
	<div class="card-header">
		<i class="bi bi-file-earmark-text me-2"></i>Assignment Details
	</div>
	<div>
		<form method="POST">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

			<div class="mb-3">
				<label class="form-label">Title</label>
				<input type="text" name="title" class="form-control" placeholder="Assignment title" required>
			</div>

			<div class="mb-3">
				<label class="form-label">Description / Instructions</label>
				<textarea name="description" class="form-control" rows="4" placeholder="Describe the assignment..." required></textarea>
			</div>

			<div class="row g-3 mb-3">
				<div class="col-md-6">
					<label class="form-label">Class</label>
					<select name="class_id" class="form-select" required>
						<option value="">Select class...</option>
						{% for c in classes %}
						<option value="{{ c.id }}">{{ c.name }}</option>
						{% endfor %}
					</select>
				</div>

				<div class="col-md-6">
					<label class="form-label">Subject</label>
					<select name="subject_id" class="form-select" required>           
						<option value="">Select subject...</option>
						{% for s in subjects %}
						<option value"{{ s.id }}">{{ s.name }}</option>
						{% endfor %}
					</select>
				</div>
			</div>

			<div class="mb-4">
				<label class="form-label">Due Date</label>
				<input type="date" name="due_date" class="form-control" required>
			</div>

			<button type="submit" class="btn btn-primary w-100">
				<i class="bi bi-plus-circle me-2"></i>Create Assignment
			</button>
		</form>
	</div>
</div>
{% endblock %}
