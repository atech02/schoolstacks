<!DOCTYPE html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<title>EduManage -School Management Platform for African Schools</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
		<style>
			/*---Tokens ------------------------*/
			:root {
				--ink:    #0C1825;
				--forest: #0F3D2A;
				--gold:   #F5A623;
				--gold2:  #E8940F;
				--teal:   #1B8F6E;
				--teal2:  #157A5C;
				--sage:   #EAF5EE;
				--mist:   #F4F8F6;
				--white:  #FFFFFF;
				--text:   #334155;
				--muted:  #64748B;
				--border: #D9EAE1;
			}
			*{box-sizing:border-box;margin:0padding:0}
			html{scroll-behavior:smooth}
			body{font-family:'DM Sans', sans-serif;color:var(--text);background:var(--white);line-height:1.6;-webkit-font-smooting:antialised}

			/* -- nav -----------------------------*/
			.nav {
				position:fixed;top:0;left:0;right:0;z-index:100;
				background:rgba(12,24,37,.92);backdrop-filter:blur(14px);
			    	padding:0 6%;height:68px;display:flex;align-items:center;justify-content:space-between;
			      	border-bottom:1px solid rgba(255,255,255,.07);
			}
			.logo {
				font-family:'Sora',sans-serif;font-size:1.35rem;font-weight:800;
				color:#fff;text-decoration:none;letter-spacing:-.4px;
			}
			.logo em{color:var(--gold);font-style:normal}
			.nav-link{display:flex;align-items:center;gap:28px}
			.nav-links a{
				color:rgba(255,255,255,.65);text-decoration:none;
				font-size:.875rem;font-weight:500;transition:color .2s;
			}
			.nav-links a:hover{color:#fff}
			.btn-nav{
				background:var(--gold);color:var(--ink)!important;
				border-radius:8px;padding:9px 22px!importont;
				font-weight:700!important;font-size:.85rem!important;
				transition:background .2s,transform .15s!important;
			}
			.btn-nav:hover{background:var(--gold2)!important;transform:translateY(-1px)!important}

			/* -- Hero --------------------------------*/
			.hero {
				background:var(--forest);
				padding:140px 6% 100px;
				position:relative;overflow:hidden;
			}
			/* Subtle texture rings */
			.hero::before{
				content:'';position:absolute;
				width:700px;height:700px;border-radius:50%;
				border:1px solid rgba(245,166,35,.08);
				top:-200px;right:-150px;
			}
			.hero::after{
				content:'';position:absolute;
				width:500px;height:500px;border-radius:50%;
				border:1px solid rgba(27,143,110,.12);
				bottom:-150px;left:-80px;
			}
			/* Gold accent bar top-left */
			.hero-accent{
				position:absolute;top:0;left:0;
				width:4px;height:100%;
				background:linear-gradient(to bottom,var(--gold),transparent);
			}
			.hero-inner{
				position:relative;z-index:1'
				max-width:760px;
			}
			.hero-eyebrow{
				display:inline-flex;align-items:center;gap:8px;
				backgroundLrgba(245,166,35,.12);
				border:1px solid rgba(245,166,35,.25);
				border-radius:999px;padding:6px 16px;
				font-size:.75rem;font-weight:700;color:var(--gold);
				text-transform:uppercase;letter-spacing:1px;
				margin-bottom:28px;
			}
			.hero h1{
				font-family:'Sora',sans-serif;
				font-size:clamp(2.4rem,5vw,3.8rem);
				font-weight:800;line-height:1.08;
				color:#fff;letter-spacing:-.5px;
				margin-bottom:22px;
			}
			.hero h1 .line-gold{
				color:var(--gold);
				display:block;
			}
			.hero-sub{
				color:rgba(255,255,255,.62);
				font-size:1.05rem;line-height:1.75;
				max-width:560px;margin-bottom:40px;
			}
			.hero-cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
			.btn-hero-primary{
				background:var(--gold);color:var(--ink);
				border:none;border-radius:10px;
				padding:14px 30px;font-family:'DM Sans',sans-serif;
				font-weight:700;font-size:.95rem;cursor:pointer;
				text-decoration:none;display:inline-flex;align-items:center;gap:8px;
				transition:background .2s, transform .15s,box-shadow .2s;
				box-shadow:0 4px 20px rgba(245,166,35,.3);
			}
			.btn-hero-primary:hover{
				background:var(--gold2);transform:translateY(-2px);
				box-shadow:0 8px 28px rgba(245,166,35,.4);
			}
			.btn-hero-ghost{
				background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);
				border:1px solid rgba(255,255,255,.18);border-radius:10px;
				padding:14px 26px;font-family:'DM Sans',sans-serif;
				font-weight:600;font-size:.95rem;cursor:pointer;
				text-decoration:none;display:inline-flex;align-items:center;gap:8px;
				transition:all .2s;
			}
			.btn-hero-ghost:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3)}
			.hero-note{
				margin-top:20px;color:rgba(255,255,255,.35);
				font-size:.8rem;display:flex;align-items:center;gap:18px;
				flex-wrap:wrap;
			}
			.hero-note span{display:flex;align-items:center;gap:5px}
			.hero-note i{color:var(--gold);font-size:.8rem}

			/* Hero stats strip */
