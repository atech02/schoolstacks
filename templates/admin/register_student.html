{% extends "base.html" %}
{% block title %}Register Student{% endblock %}
{% block page_title %}Register Student{% endblock %}
{% block content %}
<div class="page-header">
	<div>
		<h2>Register Student</h2>
		<p>Add a new student and optional parent portal link</p>
	</div>
	<a href="{{ url_for('admin.students_list') }}" class="btn btn-outline-navy">
		<i class="bi bi-arrow-left me-1"></i>Back to List
	</a>
</div>

<div class="card" style="max-width:580px;">
	<div class="card-header">
		<i class="bi bi-person-plus me-2"></i>Student Details
	</div>
	<div class="card-body p-4">
		<form method="POST">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
			<div class="row g-3">
				<div class="col-md-6">
					<label class="form-label">First Name</label>
					<input type="text" name="first_name" class="form-control" required/>
				</div>
				<div class="col-md-6">
					<label class="form-label">Last Name</label>
					<input type="text" name="last_name" class="form-control" required/>
				</div>
				<div class="col-md-6">
					<label class="form-label">Admission Number</label>
					<input type="text" name="admission_no" class="form-control" required/>
				</div>
				<div class="col-md-6">
					<label class="form-label">Gender</label>
					<select name="gender" class="form-select" required>
						<option value="">Select...</option>
						<option value="Male">Male</option>
						<option value="Female">Female</option>
					</select>
				</div>
				<div class="col-12">
					<label class="form-label">Class</label>
					<select name="class_id" class="form-select" required>
						<option value="">Select class...</option>
						{% for c in classes %}
						<option value="{{ c.id }}">{{ c.name }}</option>
						{% endfor %}
					</select>
				</div>
				<div class="col-md-6">
					<label class="form-label">Parent Username (Optional)</label>
					<input type="text" name="parent_username" class="form-control" placeholder="e.g. parent_john"/>
				</div>
				<div class="col-md-6">
					<label class="form-label">Parent Phone (Optional)</label>
					<input type="text" name="parent_phone" class="form-control" placeholder="0977000000"/>
				</div>
				<div class="col-12">
					<button type="submit" class="btn btn-primary w-100">
						<i class="bi bi-person-check me-2"></i>Register Student
					</button>
				</div>
			</div>
		</form>
	</div>
</div>
{% endblock %}
