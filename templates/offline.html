<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<meta name="theme-color" content="#1e293b"/>
	<title>Offline — EduManage</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh;">
	<div class="card p-5 text-center shadow-sm border-0" style="max-width:440px;border-radius:16px;">
		<div class="mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:64px;height:64px;border-radius:50%;background:rgba(245,158,11,.15);color:#d97706;font-size:1.8rem;">
			<i class="bi bi-wifi-off"></i>
		</div>
		<h3 class="fw-bold" style="color:#1e293b;">You're Currently Offline</h3>
		<p class="text-muted small mb-4">
			EduManage cannot reach the server right now. For security, private student records and live payment transactions require an active internet connection.
		</p>
		<button class="btn btn-dark w-100" onclick="window.location.reload()" style="background:#1e293b;border-radius:10px;padding:11px;">
			<i class="bi bi-arrow-clockwise me-1"></i>Try Again
		</button>
	</div>
</body>
</html>
