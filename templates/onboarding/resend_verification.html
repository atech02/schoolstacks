{% extends "base.html" %}
{% block title %}Resend Verification{% endblock %}
{% block auth_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5 px-3" style="background:#0f1f3d;">
	<div class="card border-0 shadow-lg p-4 p-md-5" style="max-width:440px;width:100%;border-radius:18px;">
		<h3 class="fw-bold mb-2" style="color:#0f1f3d;">Resend Verification</h3>
		<p class="text-muted small mb-4">Enter your administrator email address to receive a new verification link.</p>
		<form method="POST">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
			<div class="mb-3">
				<label class="form-label">Email Address</label>
				<input type="email" name="email" class="form-control" required/>
			</div>
			<button type="submit" class="btn btn-primary w-100">Send Verification Link</button>
		</form>
		<div class="mt-3 text-center small">
			<a href="{{ url_for('auth.login') }}" class="text-decoration-none">Back to Sign In</a>
		</div>
	</div>
</div>
{% endblock %}
